<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olympia-Tag London</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* The base map stays near-neutral so the three day-variant hues are the only
   saturated things on screen; each hue also carries a text-safe variant. */
:root{
  color-scheme:light;
  --land:#eae9e6; --grid:#dbd9d3;
  --water:#ccd7dd; --water-l:#b6c5cd;
  --park:#dde2d4; --park-l:#c9d0bb;
  --road:#dad8d1; --urban:#e3e1dc; --urban-l:#d3d0c9;
  --ink:#14161a; --ink-2:#454a52; --ink-3:#62686f;
  --card:#ffffff; --card-2:#f4f3f0; --line:#d4d2cc; --line-2:#c2bfb8;
  --A:#2a78d6; --B:#1baf7a; --C:#eb6834;
  --At:#1f5fae; --Bt:#0d7a57; --Ct:#b0491d;
  --Abg:#1f5fae; --Bbg:#0d7a57; --Cbg:#b0491d; --Vfg:#ffffff;
  --over:#bf3a2b;
  --shadow:0 1px 2px rgba(20,22,26,.10), 0 10px 26px -14px rgba(20,22,26,.40);
  --shadow-lg:0 2px 8px rgba(20,22,26,.14), 0 26px 56px -22px rgba(20,22,26,.50);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --land:#16181d; --grid:#24272e;
    --water:#1e2a32; --water-l:#2e404b;
    --park:#1f251d; --park-l:#2e382a;
    --road:#262a32; --urban:#1b1e25; --urban-l:#272b34;
    --ink:#eef0f4; --ink-2:#b0b6c0; --ink-3:#868c96;
    --card:#1c1f26; --card-2:#242832; --line:#313640; --line-2:#3f4551;
    --A:#3987e5; --B:#199e70; --C:#d95926;
    --At:#7fb6f2; --Bt:#4fc79b; --Ct:#f08a5c;
    --Abg:#3987e5; --Bbg:#199e70; --Cbg:#d95926; --Vfg:#14161a;
    --over:#f08878;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
    --shadow-lg:0 2px 8px rgba(0,0,0,.6), 0 26px 56px -22px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --land:#16181d; --grid:#24272e;
  --water:#1e2a32; --water-l:#2e404b;
  --park:#1f251d; --park-l:#2e382a;
  --road:#262a32; --urban:#1b1e25; --urban-l:#272b34;
  --ink:#eef0f4; --ink-2:#b0b6c0; --ink-3:#868c96;
  --card:#1c1f26; --card-2:#242832; --line:#313640; --line-2:#3f4551;
  --A:#3987e5; --B:#199e70; --C:#d95926;
  --At:#7fb6f2; --Bt:#4fc79b; --Ct:#f08a5c;
  --Abg:#3987e5; --Bbg:#199e70; --Cbg:#d95926; --Vfg:#14161a;
  --over:#f08878;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 26px -14px rgba(0,0,0,.8);
  --shadow-lg:0 2px 8px rgba(0,0,0,.6), 0 26px 56px -22px rgba(0,0,0,.95);
}

*{box-sizing:border-box}
html,body{height:100%; overscroll-behavior:none}
body{
  margin:0; overflow:hidden; background:var(--land); color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}

#app{position:relative; height:100%; overflow:hidden; background:var(--land)}
#viewport{
  position:absolute; inset:0; overflow:hidden; cursor:grab;
  touch-action:none; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
#viewport.drag{cursor:grabbing}

/* One transform for the whole geography; nothing inside it carries text. */
#world{
  position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform;
  background-image:radial-gradient(var(--grid) 1.6px, transparent 1.6px);
  background-size:64px 64px;
}
#geo{display:block}
#rings{transition:opacity .25s ease}
#world.detail #rings{opacity:0}

/* Everything readable lives in screen space and only ever translates, so it
   never re-rasterises while zooming. */
#stage{position:absolute; inset:0; pointer-events:none}
.sn{position:absolute; left:0; top:0}
#stage.moving .sn{will-change:transform}
.hit{pointer-events:auto}
.lvl-over, .lvl-detail{transition:opacity .2s ease}
#stage.over .lvl-detail{opacity:0; pointer-events:none}
#stage.detail .lvl-over{opacity:0; pointer-events:none}
#stage.detail .hub .sub{opacity:0}
#stage.over .under-card{opacity:0}
@media (prefers-reduced-motion:reduce){
  .lvl-over,.lvl-detail{transition:none}
}

/* ------------------------------------------------- orientation lettering */
.district{
  font-family:Archivo,sans-serif; font-size:.7rem; font-weight:500; letter-spacing:.22em;
  text-transform:uppercase; color:var(--ink-3); opacity:.62; white-space:nowrap;
  user-select:none; transition:opacity .2s ease;
}
.district.major{font-size:.76rem; opacity:.8; letter-spacing:.26em}
#stage.over .district.minor{opacity:0}
.ringlab{
  font-family:"IBM Plex Mono",monospace; font-size:.64rem; letter-spacing:.1em;
  color:var(--ink-3); white-space:nowrap; user-select:none;
  background:var(--land); padding:1px 6px; border-radius:100px;
  transition:opacity .2s ease;
}
#stage.detail .ringlab{opacity:0}

/* ---------------------------------------------------------- map lettering */
.maplabel{
  font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.16em;
  text-transform:uppercase; color:var(--ink-3); white-space:nowrap; user-select:none;
  transition:opacity .2s ease;
}
.maplabel.water{color:var(--water-l); letter-spacing:.3em; font-size:.72rem}
.maplabel.area{
  font-size:.62rem; letter-spacing:.18em; color:var(--ink-2); opacity:.75;
  transition:font-size .2s ease, opacity .2s ease;
}
#stage.detail .maplabel.area{font-size:.96rem; letter-spacing:.3em; opacity:1}
.maplabel.faint{
  color:var(--ink-3); letter-spacing:.12em; text-transform:none; font-size:.66rem;
  background:var(--land); padding:2px 8px; border-radius:100px;
}

/* ---------------------------------------------------------------- markers */
.hub{display:flex; flex-direction:column; align-items:center; gap:4px}
.hub .ring{
  width:15px; height:15px; border-radius:50%; background:var(--card);
  border:4px solid var(--ink); box-shadow:var(--shadow);
}
.hub .lb{
  font-family:"IBM Plex Mono",monospace; font-size:.66rem; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; background:var(--card); padding:2px 7px; border-radius:5px;
  border:1px solid var(--line); white-space:nowrap; color:var(--ink);
}
.hub .sub{
  font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--ink-3);
  white-space:nowrap; transition:opacity .2s ease;
}

.anchor{
  width:11px; height:11px; border-radius:50%; background:var(--card);
  border:3px solid var(--ink-3); box-shadow:var(--shadow);
}
.anchor.A{border-color:var(--A)} .anchor.B{border-color:var(--B)} .anchor.C{border-color:var(--C)}
.anchor.excl{opacity:.5}

.pin{
  display:flex; align-items:center; gap:8px; white-space:nowrap;
  background:var(--card); border:1px solid var(--line); border-radius:100px;
  padding:5px 12px 5px 8px; box-shadow:var(--shadow); cursor:pointer;
  transition:border-color .14s, box-shadow .14s;
}
.pin:hover{border-color:var(--ink); box-shadow:var(--shadow-lg)}
.pin .dot{width:9px; height:9px; border-radius:50%; background:var(--ink-3); flex:none}
.pin .nm{font-size:.83rem; font-weight:600; letter-spacing:-.01em; color:var(--ink)}
.pin .pr{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--ink-2); font-variant-numeric:tabular-nums}
.pin .pr.free{color:var(--Bt)}
.excl .pin{border-style:dashed; background:transparent; box-shadow:none}
.excl .pin .pr{text-decoration:line-through; color:var(--ink-3)}
.sn.dim{opacity:.3}
.sn:hover{z-index:20}

.cl{
  width:206px; text-align:left; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:10px 13px; box-shadow:var(--shadow); cursor:pointer;
  transition:border-color .14s, box-shadow .14s;
}
.cl:hover{box-shadow:var(--shadow-lg); border-color:var(--ink)}
.cl .kick{
  font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:3px;
}
.cl .nm{font-size:.95rem; font-weight:700; letter-spacing:-.02em; line-height:1.15; display:block; color:var(--ink)}
.cl .meta{
  font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-2);
  margin-top:4px; display:block; font-variant-numeric:tabular-nums;
}
.cl .vtags{display:flex; gap:5px; margin-top:7px}

.vtag{
  display:inline-flex; align-items:center; gap:4px; font-family:"IBM Plex Mono",monospace;
  font-size:.62rem; font-weight:600; letter-spacing:.06em; padding:2px 7px;
  border-radius:100px; border:1px solid currentColor;
}
.vtag.A{color:var(--At)} .vtag.B{color:var(--Bt)} .vtag.C{color:var(--Ct)}
.vtag.off{color:var(--over)}
.vtag .d{width:5px; height:5px; border-radius:50%; background:currentColor}

/* ------------------------------------------------------------------- card */
.cardwrap{z-index:40}
.card{
  width:min(430px,88vw); background:var(--card); border:1px solid var(--line-2);
  border-radius:14px; box-shadow:var(--shadow-lg); overflow:hidden;
  display:flex; flex-direction:column; max-height:min(74vh,620px); cursor:default;
}
.card .hd{padding:16px 18px 13px; border-bottom:1px solid var(--line); position:relative}
.card .kick{
  font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3);
}
.card h2{
  margin:4px 0 0; font-size:1.3rem; font-weight:700; letter-spacing:-.025em;
  line-height:1.15; padding-right:30px; text-wrap:balance;
}
.card .x{
  position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:7px;
  display:grid; place-items:center; color:var(--ink-3); font-size:1.05rem; line-height:1;
}
.card .x:hover{background:var(--card-2); color:var(--ink)}
.card .tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:10px}
.card .bd{overflow-y:auto; padding:15px 18px 18px; -webkit-overflow-scrolling:touch}

.hero{display:flex; gap:16px; flex-wrap:wrap; padding-bottom:14px; border-bottom:1px solid var(--line)}
.hero div{min-width:74px}
.hero dt{
  font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:2px;
}
.hero dd{margin:0; font-size:1.18rem; font-weight:700; letter-spacing:-.02em; line-height:1.15; font-variant-numeric:tabular-nums}
.hero dd small{display:block; font-size:.72rem; font-weight:400; color:var(--ink-2); letter-spacing:0; margin-top:1px}
.hero dd.free{color:var(--Bt)}
.hero dd.over{color:var(--over)}

.card h3{
  margin:16px 0 7px; font-family:"IBM Plex Mono",monospace; font-size:.62rem;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); font-weight:500;
}
.facts{margin:0; font-size:.86rem}
.facts div{display:flex; gap:12px; padding:5px 0; border-top:1px solid var(--line)}
.facts div:first-child{border-top:0; padding-top:0}
.facts dt{flex:0 0 92px; color:var(--ink-3); font-size:.78rem}
.facts dd{margin:0; flex:1; color:var(--ink-2)}
.card p.pe{margin:0; font-size:.87rem; color:var(--ink-2)}
.risks{margin:0; padding-left:16px; font-size:.83rem; color:var(--ink-2)}
.risks li{margin-bottom:5px}
.risks li::marker{color:var(--ink-3)}

/* -------------------------------------------------------------------- HUD */
.hud{position:absolute; inset:0; pointer-events:none; z-index:60}
.hud > *{pointer-events:auto}
.panel{
  position:absolute; background:var(--card); border:1px solid var(--line-2);
  border-radius:12px; box-shadow:var(--shadow);
}
.tl{top:14px; left:14px; padding:12px 15px; max-width:290px}
.tl .ttl{font-size:1.02rem; font-weight:700; letter-spacing:-.025em; line-height:1.1}
.tl .sb{font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:3px}
.tl .budget{
  margin-top:9px; padding-top:9px; border-top:1px solid var(--line);
  font-size:.76rem; color:var(--ink-2); line-height:1.4;
}
.tl .budget b{color:var(--ink); font-weight:600}
.lvlrow{
  margin-top:9px; padding-top:8px; border-top:1px solid var(--line);
  display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
}
.lvlrow .lvl{
  font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.11em;
  text-transform:uppercase; color:var(--ink); font-weight:600;
}
.lvlrow .hint{font-size:.72rem; color:var(--ink-3)}

.tr{top:14px; right:14px; padding:9px 10px; display:flex; flex-direction:column; gap:8px; align-items:stretch}
.vrow{display:flex; gap:5px}
.vbtn{
  display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px;
  padding:6px 9px; font-size:.78rem; font-weight:500; color:var(--ink-2); white-space:nowrap;
  transition:background .14s, color .14s, border-color .14s;
}
.vbtn .d{width:8px; height:8px; border-radius:50%; background:var(--ink-3)}
.vbtn.A .d{background:var(--A)} .vbtn.B .d{background:var(--B)} .vbtn.C .d{background:var(--C)}
.vbtn:hover{background:var(--card-2); color:var(--ink)}
.vbtn[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--card); font-weight:600}
.vbtn[aria-pressed="true"].A{border-color:var(--Abg); background:var(--Abg); color:var(--Vfg)}
.vbtn[aria-pressed="true"].B{border-color:var(--Bbg); background:var(--Bbg); color:var(--Vfg)}
.vbtn[aria-pressed="true"].C{border-color:var(--Cbg); background:var(--Cbg); color:var(--Vfg)}
.vbtn[aria-pressed="true"] .d{background:currentColor}
.zrow{display:flex; gap:5px; justify-content:flex-end}
.zbtn{
  width:32px; height:30px; border:1px solid var(--line); border-radius:8px;
  display:grid; place-items:center; font-size:1rem; color:var(--ink-2);
}
.zbtn.wide{width:auto; padding:0 11px; font-size:.78rem; font-weight:500}
.zbtn:hover{background:var(--card-2); color:var(--ink)}

.bl{bottom:14px; left:14px; padding:9px 12px; display:flex; align-items:center; gap:13px}
.compass{
  position:relative; width:30px; height:30px; border-radius:50%;
  border:1px solid var(--line); display:grid; place-items:center; flex:none;
}
.compass .arrow{
  width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent;
  border-bottom:10px solid var(--ink); position:absolute; top:4px;
}
.compass .n{
  position:absolute; bottom:3px; font-family:"IBM Plex Mono",monospace;
  font-size:.56rem; font-weight:600; color:var(--ink-3); letter-spacing:.06em;
}
.scale{display:flex; flex-direction:column; gap:3px}
.scale .lbl{font-size:.68rem; color:var(--ink-2); letter-spacing:.04em}
.ringkey{
  font-size:.66rem; line-height:1.3; color:var(--ink-3); padding-left:12px;
  border-left:1px solid var(--line); display:flex; flex-direction:column; justify-content:center;
}
.scale .bar{
  height:7px; border:1px solid var(--ink-2); border-top:0; width:80px;
  transition:width .12s linear;
}

.mini{
  bottom:14px; right:14px; padding:0; overflow:hidden; width:150px;
  display:block; cursor:pointer; line-height:0;
}
.mini svg{display:block; width:100%; height:auto}
.mini .cap{
  display:block; line-height:1.3; text-align:left; padding:5px 8px 6px;
  border-top:1px solid var(--line); font-family:"IBM Plex Mono",monospace;
  font-size:.58rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);
}
.mini:hover .cap{color:var(--ink)}

.strip{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  max-width:min(880px, calc(100vw - 640px)); display:flex; align-items:stretch;
  background:var(--card); border:1px solid var(--line-2); border-radius:12px;
  box-shadow:var(--shadow); overflow:hidden;
}
.strip .lead{
  padding:10px 14px; border-right:1px solid var(--line); flex:none;
  display:flex; flex-direction:column; justify-content:center; min-width:132px;
}
.strip .lead .k{font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase}
.strip .lead .n{font-size:.92rem; font-weight:700; letter-spacing:-.02em; line-height:1.15}
.strip .lead .c{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--ink-2); margin-top:2px}
.stops{display:flex; overflow-x:auto; scrollbar-width:thin}
.stop{
  flex:none; padding:9px 13px; border-right:1px solid var(--line); text-align:left;
  min-width:124px; display:flex; flex-direction:column; align-items:flex-start;
  transition:background .14s;
}
.stop:last-child{border-right:0}
.stop:hover{background:var(--card-2)}
.stop .t{font-family:"IBM Plex Mono",monospace; font-size:.72rem; font-weight:600; font-variant-numeric:tabular-nums}
.stop .l{font-size:.78rem; color:var(--ink-2); line-height:1.3; margin-top:1px}

@media (max-width:760px){
  .tl{max-width:none; right:14px; padding:10px 12px}
  .tl .budget{display:none}
  .lvlrow .hint{display:none}
  .tr{top:auto; bottom:64px; right:10px; left:10px; flex-direction:row; justify-content:space-between; align-items:center; padding:8px}
  .vrow{flex-wrap:wrap}
  .vbtn{padding:5px 8px; font-size:.74rem}
  .strip{left:10px; right:10px; bottom:106px; transform:none; max-width:none}
  .mini{display:none}
  .bl{bottom:10px; left:10px; padding:6px 9px; gap:9px}
  .scale .bar{width:60px}
  .ringkey{display:none}
  .cl{width:136px; padding:8px 10px}
  .cl .nm{font-size:.85rem}
  .cl .kick{font-size:.56rem; letter-spacing:.1em}
  .cl .meta{display:none}
  .cl .vtags{margin-top:5px}
}
</style>
</head>
<body>

<div id="app">
  <div id="viewport">
    <div id="world"><svg id="geo" aria-hidden="true"></svg></div>
    <div id="stage" class="over"></div>
  </div>

  <div class="hud">
    <div class="panel tl">
      <div class="ttl">Olympia-Tag London</div>
      <div class="sb">LK Sport · Tagesausflug ab Eastbourne</div>
      <div class="budget"><b>Limit 15 £ pro Person</b> für die Aktivität. Zug (~10–20 £) und Londoner ÖPNV (Tagescap 8,90 £) kommen zusätzlich dazu.</div>
      <div class="lvlrow"><span class="lvl" id="lvl">Übersicht</span><span class="hint" id="where">ganz London</span></div>
    </div>

    <div class="panel tr">
      <div class="vrow" role="group" aria-label="Tagesvariante">
        <button class="vbtn" id="vAll" aria-pressed="true"><span class="d"></span>Alle</button>
        <button class="vbtn A" id="vA" aria-pressed="false"><span class="d"></span>A</button>
        <button class="vbtn B" id="vB" aria-pressed="false"><span class="d"></span>B</button>
        <button class="vbtn C" id="vC" aria-pressed="false"><span class="d"></span>C</button>
      </div>
      <div class="zrow">
        <button class="zbtn wide" id="fitBtn">Übersicht</button>
        <button class="zbtn" id="zOut" aria-label="Rauszoomen">−</button>
        <button class="zbtn" id="zIn" aria-label="Reinzoomen">+</button>
      </div>
    </div>

    <div class="panel bl">
      <div class="compass" aria-hidden="true"><span class="arrow"></span><span class="n">N</span></div>
      <div class="scale"><span class="lbl mono" id="scaleLbl">1 km</span><div class="bar" id="scaleBar"></div></div>
      <div class="ringkey"><span class="rings" aria-hidden="true"></span>Ringe 2 · 5 · 10 km<br>Luftlinie ab Victoria</div>
    </div>

    <button class="panel mini" id="mini" aria-label="Zur Gesamtübersicht">
      <svg id="miniSvg" viewBox="0 0 2360 1950" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
      <span class="cap">Gesamtkarte</span>
    </button>

    <div class="strip" id="strip" hidden></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================== geo base */

  /* ============================================================== geo base */

  var LAT0 = 51.505, LON0 = -0.105, K = 15000;
  var COS = Math.cos(LAT0 * Math.PI / 180);
  var OX = 1150, OY = 800, W = 2360, H = 1950;
  var KM = K / 111.32;                       /* world px per kilometre */
  function X(lon){ return (lon - LON0) * COS * K + OX; }

      'vector-effect="non-scaling-stroke" opacity=".6"/>';

      "L" + POS.greenpark.x + " " + POS.greenpark.y +
      "L" + POS.stratford.x + " " + POS.stratford.y;
    var tube = '<path d="' + tubeD + '" fill="none" stroke="var(--road)" stroke-width="6" ' +
      'stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
      '<path d="' + tubeD + '" fill="none" stroke="var(--ink-3)" stroke-width="2.5" ' +
      'stroke-dasharray="2 9" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".6"/>';

    g.innerHTML =
      '<path d="' + smooth(INNER) + '" fill="var(--urban)" stroke="var(--urban-l)" stroke-width="1.5" ' +
        'vector-effect="non-scaling-stroke"/>' +
      water + parks +
      '<g id="rings">' + rings + "</g>" +
      rail + tube + '<g id="routes"></g>';

    document.getElementById("miniSvg").innerHTML =
      '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--land)"/>' +
      '<path d="' + smooth(INNER) + '" fill="var(--urban)"/>' +
      '<path d="' + path(THAMES) + '" fill="none" stroke="var(--water)" stroke-width="46" ' +
        'stroke-linejoin="round" stroke-linecap="round"/>' +

        return '<circle cx="' + POS[c.id].x + '" cy="' + POS[c.id].y + '" r="46" fill="var(--ink)"/>';

  /* ================================================================ camera */

  var vpEl = document.getElementById("viewport");
  var world = document.getElementById("world");
  var stage = document.getElementById("stage");
  var lvlEl = document.getElementById("lvl");

  var ZMIN = 0.12, ZMAX = 2.4, Z_IN = 0.70, Z_OUT = 0.60;
  var st  = { z:0.3, tx:0, ty:0 };   /* what is on screen this frame */
  var cam = { z:0.3, tx:0, ty:0 };   /* where the camera is heading  */

  var variant = null;
  var openId = null;

     layout, so the viewport box is measured on resize and at the start of a
     gesture rather than once per frame. */
  var VP = { w:0, h:0, l:0, t:0 };
  function measure(){
    var r = vpEl.getBoundingClientRect();
    VP.w = r.width; VP.h = r.height; VP.l = r.left; VP.t = r.top;
  }
  function vw(){ return VP.w; }
  function vh(){ return VP.h; }
  function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }

    ? function(){ return performance.now(); }
    : function(){ return Date.now(); };

  function apply(){
    world.style.transform = "translate3d(" + st.tx.toFixed(2) + "px," + st.ty.toFixed(2) +
      "px,0) scale(" + st.z.toFixed(4) + ")";
    var z = st.z, tx = st.tx, ty = st.ty;
    for (var i = 0; i < reg.length; i++){
      var r = reg[i];
      r.el.style.transform = "translate3d(" + (r.x * z + tx + r.dx).toFixed(1) + "px," +
        (r.y * z + ty + r.dy).toFixed(1) + "px,0) translate(-50%,-50%)";
    }

    updateScale();
    updateLocator();
    updateWhere();
  }

  /* -------------------------------------------------- orientation readouts */

  var scaleBar = document.getElementById("scaleBar");
  var scaleLbl = document.getElementById("scaleLbl");
  var miniBox = null;
  var whereEl = document.getElementById("where");
  var lastScale = -1, lastWhere = "";

  function updateScale(){
    /* pick 1/2/5 x 10^n kilometres so the bar lands near 90 px */
    var km = 90 / (KM * st.z);
    var p = Math.pow(10, Math.floor(Math.log10(km))), m = km / p;
    var v = (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p;
    if (v === lastScale) { scaleBar.style.width = (v * KM * st.z).toFixed(1) + "px"; return; }
    lastScale = v;
    scaleBar.style.width = (v * KM * st.z).toFixed(1) + "px";
    scaleLbl.textContent = v >= 1 ? (v % 1 ? v.toFixed(1).replace(".", ",") : v) + " km"
                                  : Math.round(v * 1000) + " m";
  }

  function updateLocator(){
    if (!miniBox) miniBox = document.getElementById("miniBox");
    if (!miniBox) return;
    miniBox.setAttribute("x", ((0 - st.tx) / st.z).toFixed(0));
    miniBox.setAttribute("y", ((0 - st.ty) / st.z).toFixed(0));
    miniBox.setAttribute("width", (vw() / st.z).toFixed(0));
    miniBox.setAttribute("height", (vh() / st.z).toFixed(0));
  }

  var COMPASS = ["nördlich", "nordöstlich", "östlich", "südöstlich",
                 "südlich", "südwestlich", "westlich", "nordwestlich"];

  /* what the centre of the screen is looking at, in words */
  function updateWhere(){
    var cx = (vw() / 2 - st.tx) / st.z, cy = (vh() / 2 - st.ty) / st.z;
    var best = null, bestD = Infinity;
    LANDMARKS.forEach(function(l){
      var d = Math.hypot(l.x - cx, l.y - cy);
      if (d < bestD){ bestD = d; best = l; }
    });
    var v = POS.victoria;
    var km = Math.hypot(cx - v.x, cy - v.y) / KM;
    var txt;
    if (bestD / KM < 0.35 && best.id === "victoria") txt = "bei London Victoria";
    else if (km < 0.6) txt = "Zentrum · London Victoria";
    else {
      var ang = (Math.atan2(cx - v.x, v.y - cy) * 180 / Math.PI + 360) % 360;
      txt = (bestD / KM < 2.2 ? best.name + " · " : "") +
        km.toFixed(km < 10 ? 1 : 0).replace(".", ",") + " km " +
        COMPASS[Math.round(ang / 45) % 8] + " von Victoria";

    lastWhere = txt;
    whereEl.textContent = txt;

  /* a dead band around the switch keeps the two layers from flickering when
     the wheel lands right on the threshold */
  function syncLevel(){
    var next = level === "over" ? (st.z > Z_IN ? "detail" : "over")
                                : (st.z < Z_OUT ? "over" : "detail");
    if (next === level) return;
    level = next;
    stage.classList.toggle("over", level === "over");
    stage.classList.toggle("detail", level === "detail");
    world.classList.toggle("detail", level === "detail");
    lvlEl.textContent = level === "over" ? "Übersicht" : "Detail";
  }

  function kick(){
    if (rafId === null){ lastT = 0; rafId = requestAnimationFrame(frame); }
  }

  /* will-change gives every label its own layer, so the class goes on for the
     whole gesture and comes off once, late — never flipped per frame. */
  function busy(){
    if (settle){ clearTimeout(settle); settle = null; }
    stage.classList.add("moving");
  }
  function idle(){
    if (settle || live) return;
    settle = setTimeout(function(){
      settle = null;
      if (!live && rafId === null) stage.classList.remove("moving");
    }, 240);
  }

  function frame(ts){
    rafId = null;
    var dt = lastT ? Math.min(64, ts - lastT) : 16.7;
    lastT = ts;
    var k = reduce ? 1 : 1 - Math.pow(1 - 0.26, dt / 16.667);
    var moving = false;

    /* Scale and offset ease with the same factor, and that alone pins the point
       under the finger while a zoom runs: tx(t) = sx - wx*z(t) holds for every
       t when both sides use the same interpolation. Because the offset stays a
       plain target instead of a locked anchor, a drag can move the map in the
       very frames the zoom is still converging. */
    if (Math.abs(cam.z - st.z) > 0.0004){ st.z += (cam.z - st.z) * k; moving = true; }
    else st.z = cam.z;
    if (Math.abs(cam.tx - st.tx) > 0.06){ st.tx += (cam.tx - st.tx) * k; moving = true; }
    else st.tx = cam.tx;
    if (Math.abs(cam.ty - st.ty) > 0.06){ st.ty += (cam.ty - st.ty) * k; moving = true; }
    else st.ty = cam.ty;

    /* one DOM pass per frame, however many pointers reported in between */
    if (moving || dirty){ apply(); dirty = false; }
    if (moving || live) kick();
    else idle();

  /* how far the offset may travel before the world would leave the screen */
  function bounds(z){
    var pad = 140;
    var xb = vw() - W * z - pad, yb = vh() - H * z - pad;
    return { x0:Math.min(pad, xb), x1:Math.max(pad, xb),

  }

  /* Zoom to nz keeping the world point under (sx,sy) put. The anchor is read
     off the camera target, so rapid repeated steps compose instead of fighting. */
  function zoomTo(nz, sx, sy){
    if (sx == null){ sx = vw() / 2; sy = vh() / 2; }
    nz = clamp(nz, ZMIN, ZMAX);
    var wx = (sx - cam.tx) / cam.z, wy = (sy - cam.ty) / cam.z;
    cam.z = nz; cam.tx = sx - wx * nz; cam.ty = sy - wy * nz;
    busy(); kick();
  }

  function flyTo(nz, tx, ty){
    cam.z = clamp(nz, ZMIN, ZMAX);
    cam.tx = tx; cam.ty = ty;
    busy(); kick();
  }

     amount: it tracks the finger 1:1 and leaves an easing zoom intact. */
  function panBy(dx, dy){
    var b = bounds(st.z);

    cam.tx += tx - st.tx; cam.ty += ty - st.ty;
    st.tx = tx; st.ty = ty;
    dirty = true; busy(); kick();
  }

    cam.ty = clamp(cam.ty + dy, b.y0, b.y1);
    busy(); kick();
  }

  function centerOn(id, nz){
    var p = POS[id]; if (!p) return;
    var z = clamp(nz || Math.max(st.z, 1.0), ZMIN, ZMAX);

  /* On a narrow screen the whole world only fits at a zoom where the area
     cards would overlap, so phones frame London and pan to the rail tail. */
  var BOX_ALL = { x:0, y:0, w:W, h:H };
  var BOX_LDN = { x:250, y:40, w:2070, h:1290 };

    var narrow = vw() < 760;
    var box = narrow ? BOX_LDN : BOX_ALL;
    var insetT = narrow ? 120 : 104, insetB = narrow ? 150 : 78, insetX = narrow ? 12 : 24;

    var t = fitTarget();

  /* ================================================================= stage */

  function put(cls, html, x, y, dx, dy){

  function vtags(list){

      '<span class="nm">' + esc(c.name) + "</span>" +
      '<span class="meta">' + esc(c.meta) + "</span>" +
      (c.v.length ? '<span class="vtags">' + vtags(c.v) + "</span>" : "") +

    var vk = s.v.length ? s.v[0] : "";

      '<span class="nm">' + esc(s.short || s.name) + "</span>" +
      '<span class="pr' + (s.price === 0 ? " free" : "") + '">' + esc(s.priceL) + "</span>" +
      "</button>";

    var over = s.price > 15;

      '<div class="hd">' +
        '<button class="x" data-close="1" aria-label="Schließen">✕</button>' +
        '<div class="kick">' + esc(s.venue) + "</div>" +
        "<h2>" + esc(s.name) + "</h2>" +
        '<div class="tags">' + (s.v.length ? vtags(s.v) : "") +

        "</div>" +
      "</div>" +
      '<div class="bd">' +
        '<dl class="hero">' +
          '<div><dt>Kosten p. P.</dt><dd class="' + (s.price === 0 ? "free" : over ? "over" : "") + '">' +
            esc(s.priceL) + (s.priceSub ? "<small>" + esc(s.priceSub) + "</small>" : "") + "</dd></div>" +
          "<div><dt>Dauer</dt><dd>" + esc(s.dur) +
            (s.durSub ? "<small>" + esc(s.durSub) + "</small>" : "") + "</dd></div>" +
        "</dl>" +
        "<h3>Wo &amp; wie hin</h3>" +
        '<dl class="facts">' +
          "<div><dt>Ort</dt><dd>" + esc(s.where) + "</dd></div>" +
          "<div><dt>Anfahrt</dt><dd>" + esc(s.travel) + "</dd></div>" +
          "<div><dt>Buchung</dt><dd>" + esc(s.booking) + "</dd></div>" +

  /* Rebuilt only on discrete actions — never while zooming or panning. */
  function buildStage(){

    });

    PARKS.forEach(function(p){
      put("maplabel" + (p.card ? " under-card area" : "") + (p.minor ? " lvl-detail" : ""),
          esc(p.n).toUpperCase(),
          X(p.lab[1]), Y(p.lab[0]));

    put("maplabel faint", "Bahn nicht maßstäblich",
        (POS.eastbourne.x + POS.victoria.x) / 2, (POS.eastbourne.y + POS.victoria.y) / 2);

    HUBS.forEach(function(h){
      put("hit" + (h.quiet ? " lvl-detail" : ""),
        '<div class="hub"><span class="ring"></span><span class="lb">' + esc(h.name) +

    });

      POS.eastbourne.x, POS.eastbourne.y);

      var dim = variant && (c.v.indexOf(variant) < 0);
      put("hit lvl-over" + (dim ? " dim" : ""), clusterHTML(c), POS[c.id].x, POS[c.id].y);

    SPOTS.forEach(function(s){
      var vk = s.v.length ? s.v[0] : "";
      var dim = variant && s.v.indexOf(variant) < 0;
      var p = POS[s.id];
      put("lvl-detail anchor " + vk + (s.excl ? " excl" : "") + (dim ? " dim" : ""), "", p.x, p.y);

            pinHTML(s), p.x, p.y, o[0], o[1]);
      }
    });

    apply();
  }

  function renderRoutes(){
    var g = document.getElementById("routes");
    if (!g) return;
    var out = "";
    CLUSTERS.forEach(function(c){
      if (!c.leads) return;
      var a = POS[c.id];
      c.leads.forEach(function(id){
        var b = POS[id]; if (!b) return;
        out += '<path class="lead-line" d="M' + a.x.toFixed(1) + " " + a.y.toFixed(1) +
          "L" + b.x.toFixed(1) + " " + b.y.toFixed(1) +
          '" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="5 7" fill="none" ' +
          'vector-effect="non-scaling-stroke" opacity=".5"/>';
      });
    });
    if (variant){
      var v = VAR[variant];
      var pts = v.route.map(function(id){ return POS[id]; }).filter(Boolean);
      var d = pts.map(function(p, i){
        return (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1);
      }).join(" ");
      out += '<path d="' + d + '" fill="none" stroke="' + v.color + '" stroke-width="7" ' +
        'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".22"/>' +
        '<path d="' + d + '" fill="none" stroke="' + v.color + '" stroke-width="2.5" ' +
        'stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1 11" ' +
        'vector-effect="non-scaling-stroke"/>';
    }
    g.innerHTML = out;
  }

  function renderStrip(){
    var el = document.getElementById("strip");
    if (!variant){ el.hidden = true; return; }
    var v = VAR[variant];
    el.hidden = false;
    el.innerHTML =
      '<div class="lead"><span class="k" style="color:var(--' + variant + 't)">VARIANTE ' + variant + "</span>" +
        '<span class="n">' + esc(v.name) + '</span><span class="c">' + esc(v.cost) + "</span></div>" +
      '<div class="stops">' + v.stops.map(function(s){
        return '<button class="stop" data-goto="' + s[2] + '"><span class="t" style="color:var(--' +
          variant + 't)">' + esc(s[0]) + '</span><span class="l">' + esc(s[1]) + "</span></button>";
      }).join("") + "</div>";
  }

  function setVariant(k){
    variant = k;

  /* ================================================================ events */

  stage.addEventListener("click", function(e){

  document.getElementById("strip").addEventListener("click", function(e){
    var b = e.target.closest("[data-goto]");
    if (!b) return;
    var id = b.dataset.goto;
    if (SPOTS.some(function(s){ return s.id === id; })) openSpot(id);
    else centerOn(id, Math.max(st.z, 0.8));
  });

  document.getElementById("vAll").addEventListener("click", function(){ setVariant(null); });
  ["A", "B", "C"].forEach(function(k){
    document.getElementById("v" + k).addEventListener("click", function(){
      setVariant(variant === k ? null : k);
    });
  });
  document.getElementById("fitBtn").addEventListener("click", function(){ closeCard(); fit(true); });
  document.getElementById("zIn").addEventListener("click", function(){ zoomTo(cam.z * 1.6); });
  document.getElementById("zOut").addEventListener("click", function(){ zoomTo(cam.z / 1.6); });

  vpEl.addEventListener("wheel", function(e){

     Every later move re-derives the camera from that one point, so the pinch
     never accumulates drift and survives a finger joining or leaving. */
  function startPinch(){
    var a = firstTwo();
    if (a.length < 2){ pinch = null; return; }
    var mx = (a[0].x + a[1].x) / 2 - VP.l, my = (a[0].y + a[1].y) / 2 - VP.t;
    pinch = {
      d:Math.max(24, Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y)),
      z:st.z,
      wx:(mx - st.tx) / st.z,
      wy:(my - st.ty) / st.z
    };
    dragging = false; last = null;
  }

  vpEl.addEventListener("pointerdown", function(e){
    if (e.target.closest(".card")) return;
    if (!pts.size) measure();
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    live = true; swallow = false;
    if (pts.size === 1){ last = { x:e.clientX, y:e.clientY }; dragging = false; }
    else startPinch();
    /* no busy() and no frame here: a plain tap should not promote every label
       to its own layer, and the first real move starts the loop itself */
  });

  vpEl.addEventListener("pointermove", function(e){
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if (pts.size > 1){
      if (!pinch) startPinch();
      var a = firstTwo();
      var d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      var mx = (a[0].x + a[1].x) / 2 - VP.l, my = (a[0].y + a[1].y) / 2 - VP.t;
      var nz = clamp(pinch.z * (d / pinch.d), ZMIN, ZMAX);
      /* The world point that was under the midpoint stays under it, so
         spreading the fingers and sliding them across the glass zoom and pan
         in the same frame — neither cancels the other. */
      st.z = nz;
      st.tx = mx - pinch.wx * nz;
      st.ty = my - pinch.wy * nz;
      var b = bounds(nz);
      st.tx = clamp(st.tx, b.x0, b.x1); st.ty = clamp(st.ty, b.y0, b.y1);
      cam.z = st.z; cam.tx = st.tx; cam.ty = st.ty;
      dragging = true; swallow = true;
      dirty = true; busy(); kick();
      return;
    }

    if (!last) return;
    var dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (!dragging){
      /* a finger wobbles far more than a mouse, so a tap needs room */
      var slop = e.pointerType === "mouse" ? 5 : 11;
      if (Math.abs(dx) + Math.abs(dy) < slop) return;
      dragging = true; swallow = true;
      captured = e.pointerId;
      try { vpEl.setPointerCapture(e.pointerId); } catch (err){}
      vpEl.classList.add("drag");
    }
    last = { x:e.clientX, y:e.clientY };
    panBy(dx, dy);
  });

  function up(e){
    pts.delete(e.pointerId);
    if (captured === e.pointerId){
      if (vpEl.hasPointerCapture(e.pointerId)) vpEl.releasePointerCapture(e.pointerId);
      captured = null;
    }

    if (pts.size > 1){ startPinch(); return; }       /* a third finger left */

    if (pts.size === 1){
      /* Lifting one finger of a pinch must not jerk the map: carry on panning
         from wherever the remaining finger actually is. */
      var r = null;
      pts.forEach(function(v){ r = v; });
      last = { x:r.x, y:r.y };
      pinch = null; dragging = true;
      return;
    }

    live = false; pinch = null;
    vpEl.classList.remove("drag");

    /* Double tap to zoom — iPadOS does not reliably raise dblclick here. */
    if (!dragging && e.pointerType !== "mouse" &&
        !e.target.closest(".card") && !e.target.closest(".hit")){
      var t = now();
      if (t - tapT < 330 && Math.abs(e.clientX - tapX) < 32 && Math.abs(e.clientY - tapY) < 32){
        tapT = 0; swallow = true;
        tapZoom(e.clientX - VP.l, e.clientY - VP.t, false);
      } else { tapT = t; tapX = e.clientX; tapY = e.clientY; }
    }

    last = null; dragging = false;
    idle(); kick();
  }
  vpEl.addEventListener("pointerup", up);
  vpEl.addEventListener("pointercancel", up);

  /* Depending on the engine, touch-action:none on the viewport also switches
     off native scrolling inside an open card. This scrolls the card body by
     hand, but only where the engine demonstrably does not — the moment the box
     moves on its own, the takeover steps aside instead of doubling it. */
  (function(){
    var sc = null;
    stage.addEventListener("pointerdown", function(e){
      var bd = e.target.closest(".card .bd");
      if (!bd || bd.scrollHeight <= bd.clientHeight + 1) return;
      sc = { el:bd, y:e.clientY, id:e.pointerId, top:bd.scrollTop, own:false };
    });
    stage.addEventListener("pointermove", function(e){
      if (!sc || sc.id !== e.pointerId) return;
      if (sc.el.scrollTop !== sc.top){ sc = null; return; }   /* the engine has it */
      if (!sc.own){
        if (Math.abs(e.clientY - sc.y) < 8) return;           /* give it the chance */
        sc.own = true; sc.y = e.clientY; return;
      }
      sc.el.scrollTop -= e.clientY - sc.y;
      sc.y = e.clientY;
      sc.top = sc.el.scrollTop;
    });
    function end(e){ if (sc && sc.id === e.pointerId) sc = null; }
    stage.addEventListener("pointerup", end);
    stage.addEventListener("pointercancel", end);
  })();

  document.addEventListener("keydown", function(e){
    var t = (e.target.tagName || "").toLowerCase();
    if (t === "input" || t === "textarea") return;
    if (e.key === "Escape"){ if (openId) closeCard(); else if (variant) setVariant(null); }
    else if (e.key === "+" || e.key === "=") zoomTo(cam.z * 1.6);
    else if (e.key === "-") zoomTo(cam.z / 1.6);
    else if (e.key === "0"){ closeCard(); fit(true); }
    else if (e.key === "ArrowLeft"){ nudge(140, 0); e.preventDefault(); }
    else if (e.key === "ArrowRight"){ nudge(-140, 0); e.preventDefault(); }
    else if (e.key === "ArrowUp"){ nudge(0, 140); e.preventDefault(); }
    else if (e.key === "ArrowDown"){ nudge(0, -140); e.preventDefault(); }
    else if (e.key === "a" || e.key === "A") setVariant(variant === "A" ? null : "A");
    else if (e.key === "b" || e.key === "B") setVariant(variant === "B" ? null : "B");
    else if (e.key === "c" || e.key === "C") setVariant(variant === "C" ? null : "C");
  });

  var rt = null;
  function relayout(){
    clearTimeout(rt);
    rt = setTimeout(function(){ measure(); dirty = true; kick(); }, 120);
  }
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", relayout);

  /* ================================================================== boot */

  CLUSTERS.forEach(function(c){ LANDMARKS.push({ id:c.id, name:c.name, x:POS[c.id].x, y:POS[c.id].y }); });
  HUBS.forEach(function(h){ if (!h.quiet) LANDMARKS.push({ id:h.id, name:h.name, x:POS[h.id].x, y:POS[h.id].y }); });
  DISTRICTS.forEach(function(d){ LANDMARKS.push({ id:"d", name:d.n, x:X(d.lon), y:Y(d.lat) }); });
  LANDMARKS.push({ id:"eastbourne", name:"Eastbourne", x:POS.eastbourne.x, y:POS.eastbourne.y });

  document.getElementById("mini").addEventListener("click", function(){ closeCard(); fit(true); });

  buildGeo();
  world.style.width = W + "px";
  world.style.height = H + "px";
  buildStage();
  renderRoutes();
  fit(false);
})();
</script>
</body>
</html>
