<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olympia-Tag London</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --land:#f1f0ec; --grid:#dbd9d2;
  --water:#c3d8e4; --water-l:#a5c3d3;
  --park:#dce5d1; --park-l:#c5d3b6;
  --road:#e2e0d9;
  --ink:#15171b; --ink-2:#4e525a; --ink-3:#868b95;
  --card:#ffffff; --card-2:#f7f6f3; --line:#dedcd7;
  --A:#2a78d6; --B:#1baf7a; --C:#eb6834;
  --accent:#d6006e; --accent-soft:#fce9f2;
  --warn:#9a5a08;
  --shadow:0 1px 2px rgba(20,22,26,.09), 0 10px 30px -12px rgba(20,22,26,.30);
  --shadow-lg:0 2px 6px rgba(20,22,26,.12), 0 28px 60px -20px rgba(20,22,26,.45);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --land:#111419; --grid:#1c2029;
    --water:#14252f; --water-l:#1e3a49;
    --park:#16241b; --park-l:#223628;
    --road:#212630;
    --ink:#eef1f5; --ink-2:#aab2be; --ink-3:#767e8b;
    --card:#191d25; --card-2:#20252f; --line:#2b303b;
    --A:#3987e5; --B:#199e70; --C:#d95926;
    --accent:#ff5fae; --accent-soft:#2d1020;
    --warn:#e0a44a;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -12px rgba(0,0,0,.8);
    --shadow-lg:0 2px 6px rgba(0,0,0,.6), 0 28px 60px -20px rgba(0,0,0,.95);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --land:#111419; --grid:#1c2029;
  --water:#14252f; --water-l:#1e3a49;
  --park:#16241b; --park-l:#223628;
  --road:#212630;
  --ink:#eef1f5; --ink-2:#aab2be; --ink-3:#767e8b;
  --card:#191d25; --card-2:#20252f; --line:#2b303b;
  --A:#3987e5; --B:#199e70; --C:#d95926;
  --accent:#ff5fae; --accent-soft:#2d1020;
  --warn:#e0a44a;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -12px rgba(0,0,0,.8);
  --shadow-lg:0 2px 6px rgba(0,0,0,.6), 0 28px 60px -20px rgba(0,0,0,.95);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden; background:var(--land); color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}

#app{position:relative; height:100%; overflow:hidden; background:var(--land)}

/* ------------------------------------------------------------ map canvas */
#viewport{position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none}
#viewport.drag{cursor:grabbing}
#world{
  position:absolute; top:0; left:0; transform-origin:0 0;
  background-image:radial-gradient(var(--grid) 1.6px, transparent 1.6px);
  background-size:64px 64px;
}
#geo{position:absolute; top:0; left:0; pointer-events:none}
#world.over .under-card{opacity:0}
#geo text{
  font-size:clamp(13px, calc(12px / var(--z, .4)), 40px);
  letter-spacing:.11em;
  stroke:var(--land); stroke-width:5px; paint-order:stroke; stroke-linejoin:round;
}
#geo text.big{font-size:clamp(15px, calc(15px / var(--z, .4)), 46px); letter-spacing:.22em}
.under-card{transition:opacity .2s}

/* ------------------------------------------------------------ map nodes */
.node{
  position:absolute; transform-origin:center center;
  transform:translate(-50%,-50%) scale(var(--inv,1));
  will-change:transform;
}
.node.hidden{display:none}

.node.spot{width:0; height:0}
.anchor{
  position:absolute; left:0; top:0; transform:translate(-50%,-50%);
  width:11px; height:11px; border-radius:50%; background:var(--card);
  border:3px solid var(--ink-3); box-shadow:var(--shadow);
}
.anchor.A{border-color:var(--A)} .anchor.B{border-color:var(--B)} .anchor.C{border-color:var(--C)}
.node.excl .anchor{opacity:.55}
.node.dim .anchor{opacity:.3}
.node.spot .pin{position:absolute; left:0; top:0}
.node.spot .card{position:absolute; left:0; top:0; transform:translate(-50%,-50%)}
.pin{
  display:flex; align-items:center; gap:8px; white-space:nowrap;
  background:var(--card); border:1px solid var(--line); border-radius:100px;
  padding:5px 12px 5px 8px; box-shadow:var(--shadow); cursor:pointer;
  transition:border-color .15s, box-shadow .15s, transform .15s;
}
.node.spot:hover{z-index:30}
.pin:hover{border-color:var(--ink); box-shadow:var(--shadow-lg)}
.pin .dot{width:9px; height:9px; border-radius:50%; background:var(--ink-3); flex:none}
.pin .nm{font-size:.83rem; font-weight:600; letter-spacing:-.01em}
.pin .pr{font-family:"IBM Plex Mono",monospace; font-size:.75rem; color:var(--ink-2); font-variant-numeric:tabular-nums}
.pin .pr.free{color:var(--B)}
.node.dim .pin{opacity:.32}
.node.excl .pin{border-style:dashed; background:transparent; box-shadow:none}
.node.excl .pr{text-decoration:line-through; color:var(--ink-3)}

.hub{display:flex; flex-direction:column; align-items:center; gap:4px; cursor:default}
.hub .ring{
  width:17px; height:17px; border-radius:50%; background:var(--card);
  border:4px solid var(--ink); box-shadow:var(--shadow);
}
.hub .lb{
  font-family:"IBM Plex Mono",monospace; font-size:.68rem; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; background:var(--card); padding:2px 7px; border-radius:5px;
  border:1px solid var(--line); white-space:nowrap;
}
.hub .sub{font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--ink-3); white-space:nowrap}

.cl{
  width:206px; text-align:left; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:10px 13px; box-shadow:var(--shadow); cursor:pointer;
  transition:border-color .15s, transform .15s, box-shadow .15s;
}
.cl:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg); border-color:var(--ink-3)}
.cl .kick{
  font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3); display:block; margin-bottom:3px;
}
.cl .nm{font-size:.95rem; font-weight:700; letter-spacing:-.02em; line-height:1.15; display:block}
.cl .meta{
  font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-2);
  margin-top:4px; display:block; font-variant-numeric:tabular-nums;
}
.cl .vtags{display:flex; gap:5px; margin-top:7px}
.cl .zoom{
  margin-top:9px; font-size:.72rem; color:var(--ink-3);
  display:flex; align-items:center; gap:5px;
}
.node.dim .cl{opacity:.35}

.vtag{
  display:inline-flex; align-items:center; gap:4px; font-family:"IBM Plex Mono",monospace;
  font-size:.62rem; font-weight:600; letter-spacing:.06em; padding:2px 7px;
  border-radius:100px; border:1px solid currentColor;
}
.vtag.A{color:var(--A)} .vtag.B{color:var(--B)} .vtag.C{color:var(--C)}
.vtag .d{width:5px; height:5px; border-radius:50%; background:currentColor}

/* ------------------------------------------------------------ open card */
.node.open{z-index:40}
.card{
  width:min(430px,88vw); background:var(--card); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow-lg); overflow:hidden;
  display:flex; flex-direction:column; max-height:min(74vh,620px); cursor:default;
}
.card .hd{padding:16px 18px 13px; border-bottom:1px solid var(--line); position:relative}
.card .kick{
  font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3);
}
.card h2{
  margin:4px 0 0; font-size:1.3rem; font-weight:700; letter-spacing:-.025em;
  line-height:1.15; padding-right:30px; text-wrap:balance;
}
.card .x{
  position:absolute; top:12px; right:12px; width:26px; height:26px; border-radius:7px;
  display:grid; place-items:center; color:var(--ink-3); font-size:1.05rem; line-height:1;
}
.card .x:hover{background:var(--card-2); color:var(--ink)}
.card .tags{display:flex; gap:5px; flex-wrap:wrap; margin-top:10px}
.card .bd{overflow-y:auto; padding:15px 18px 18px; -webkit-overflow-scrolling:touch}

.hero{display:flex; gap:16px; flex-wrap:wrap; padding-bottom:14px; border-bottom:1px solid var(--line)}
.hero div{min-width:74px}
.hero dt{
  font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.12em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:2px;
}
.hero dd{margin:0; font-size:1.18rem; font-weight:700; letter-spacing:-.02em; line-height:1.15; font-variant-numeric:tabular-nums}
.hero dd small{display:block; font-size:.72rem; font-weight:400; color:var(--ink-2); letter-spacing:0; margin-top:1px}
.hero dd.free{color:var(--B)}
.hero dd.over{color:var(--accent)}

.card h3{
  margin:16px 0 7px; font-family:"IBM Plex Mono",monospace; font-size:.62rem;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3); font-weight:500;
}
.facts{margin:0; font-size:.86rem}
.facts div{display:flex; gap:12px; padding:5px 0; border-top:1px solid var(--line)}
.facts div:first-child{border-top:0; padding-top:0}
.facts dt{flex:0 0 92px; color:var(--ink-3); font-size:.78rem}
.facts dd{margin:0; flex:1; color:var(--ink-2)}
.card p.pe{margin:0; font-size:.87rem; color:var(--ink-2)}
.risks{margin:0; padding-left:16px; font-size:.83rem; color:var(--ink-2)}
.risks li{margin-bottom:5px}
.risks li::marker{color:var(--warn)}

/* ------------------------------------------------------------ HUD */
.hud{position:absolute; inset:0; pointer-events:none; z-index:60}
.hud > *{pointer-events:auto}
.panel{
  position:absolute; background:var(--card); border:1px solid var(--line);
  border-radius:12px; box-shadow:var(--shadow);
}
.tl{top:14px; left:14px; padding:12px 15px; max-width:290px}
.tl .ttl{font-size:1.02rem; font-weight:700; letter-spacing:-.025em; line-height:1.1}
.tl .sb{font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:3px}
.tl .budget{
  margin-top:9px; padding-top:9px; border-top:1px solid var(--line);
  font-size:.76rem; color:var(--ink-2); line-height:1.4;
}
.tl .budget b{color:var(--ink); font-weight:600}

.tr{top:14px; right:14px; padding:9px 10px; display:flex; flex-direction:column; gap:8px; align-items:stretch}
.vrow{display:flex; gap:5px}
.vbtn{
  display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px;
  padding:6px 9px; font-size:.78rem; font-weight:500; color:var(--ink-2); white-space:nowrap;
}
.vbtn .d{width:8px; height:8px; border-radius:50%; background:var(--ink-3)}
.vbtn.A .d{background:var(--A)} .vbtn.B .d{background:var(--B)} .vbtn.C .d{background:var(--C)}
.vbtn:hover{background:var(--card-2)}
.vbtn[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--card); font-weight:600}
.vbtn[aria-pressed="true"].A{border-color:var(--A); background:var(--A); color:#fff}
.vbtn[aria-pressed="true"].B{border-color:var(--B); background:var(--B); color:#fff}
.vbtn[aria-pressed="true"].C{border-color:var(--C); background:var(--C); color:#fff}
.vbtn[aria-pressed="true"] .d{background:currentColor}
.zrow{display:flex; gap:5px; justify-content:flex-end}
.zbtn{
  width:32px; height:30px; border:1px solid var(--line); border-radius:8px;
  display:grid; place-items:center; font-size:1rem; color:var(--ink-2);
}
.zbtn.wide{width:auto; padding:0 11px; font-size:.78rem; font-weight:500}
.zbtn:hover{background:var(--card-2); color:var(--ink)}

.lvlrow{
  margin-top:9px; padding-top:8px; border-top:1px solid var(--line);
  display:flex; align-items:baseline; gap:9px; flex-wrap:wrap;
}
.lvlrow .lvl{
  font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.11em;
  text-transform:uppercase; color:var(--accent); font-weight:600;
}
.lvlrow .hint{font-size:.72rem; color:var(--ink-3)}

.strip{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  max-width:min(1120px, calc(100vw - 28px)); display:flex; align-items:stretch;
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  box-shadow:var(--shadow); overflow:hidden;
}
.strip .lead{
  padding:10px 14px; border-right:1px solid var(--line); flex:none;
  display:flex; flex-direction:column; justify-content:center; min-width:132px;
}
.strip .lead .k{font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase}
.strip .lead .n{font-size:.92rem; font-weight:700; letter-spacing:-.02em; line-height:1.15}
.strip .lead .c{font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--ink-2); margin-top:2px}
.stops{display:flex; overflow-x:auto; scrollbar-width:thin}
.stop{
  flex:none; padding:9px 13px; border-right:1px solid var(--line); text-align:left;
  min-width:124px; display:flex; flex-direction:column; align-items:flex-start;
  transition:background .14s;
}
.stop:last-child{border-right:0}
.stop:hover{background:var(--card-2)}
.stop .t{font-family:"IBM Plex Mono",monospace; font-size:.72rem; font-weight:600; font-variant-numeric:tabular-nums}
.stop .l{font-size:.78rem; color:var(--ink-2); line-height:1.3; margin-top:1px}

@media (max-width:760px){
  .tl{max-width:none; right:14px; padding:10px 12px}
  .tl .budget{display:none}
  .tr{top:auto; bottom:64px; right:10px; left:10px; flex-direction:row; justify-content:space-between; align-items:center; padding:8px}
  .vrow{flex-wrap:wrap}
  .vbtn{padding:5px 8px; font-size:.74rem}
  .lvlrow .hint{display:none}
  .strip{left:10px; right:10px; bottom:106px; transform:none; max-width:none}
  .cl{width:136px; padding:8px 10px}
  .cl .nm{font-size:.85rem}
  .cl .kick{font-size:.56rem; letter-spacing:.1em}
  .cl .meta{display:none}
  .cl .vtags{margin-top:5px}
  .strip .lead{min-width:112px; padding:8px 11px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms !important}}
</style>
</head>
<body>

<div id="app">
  <div id="viewport">
    <div id="world">
      <svg id="geo" aria-hidden="true"></svg>
      <div id="nodes"></div>
    </div>
  </div>

  <div class="hud">
    <div class="panel tl">
      <div class="ttl">Olympia-Tag London</div>
      <div class="sb">LK Sport · Tagesausflug ab Eastbourne</div>
      <div class="budget"><b>Limit 15 £ pro Person</b> für die Aktivität. Zug (~10–20 £) und Londoner ÖPNV (Tagescap 8,90 £) kommen zusätzlich dazu.</div>
      <div class="lvlrow"><span class="lvl" id="lvl">Übersicht</span><span class="hint" id="hint">Ziehen · Scrollen zum Zoomen</span></div>
    </div>

    <div class="panel tr">
      <div class="vrow" role="group" aria-label="Tagesvariante">
        <button class="vbtn" id="vAll" aria-pressed="true"><span class="d"></span>Alle</button>
        <button class="vbtn A" id="vA" aria-pressed="false"><span class="d"></span>A</button>
        <button class="vbtn B" id="vB" aria-pressed="false"><span class="d"></span>B</button>
        <button class="vbtn C" id="vC" aria-pressed="false"><span class="d"></span>C</button>
      </div>
      <div class="zrow">
        <button class="zbtn wide" id="fitBtn">Übersicht</button>
        <button class="zbtn" id="zOut" aria-label="Rauszoomen">−</button>
        <button class="zbtn" id="zIn" aria-label="Reinzoomen">+</button>
      </div>
    </div>


    <div class="strip" id="strip" hidden></div>
  </div>
</div>

  var BOX_ALL = { x:0, y:0, w:W, h:H };

  function fit(animate){
    var narrow = vw() < 760;
    var box = narrow ? BOX_LDN : BOX_ALL;
    var insetT = narrow ? 120 : 104, insetB = narrow ? 150 : 78, insetX = narrow ? 12 : 24;
    var aw = Math.max(200, vw() - insetX * 2), ah = Math.max(200, vh() - insetT - insetB);
    var z = Math.max(ZMIN, Math.min(Math.min(aw / box.w, ah / box.h), 1));
    var t = { z:z,
              tx:insetX + (aw - box.w * z) / 2 - box.x * z,
              ty:insetT + (ah - box.h * z) / 2 - box.y * z };
    animate ? tween(t) : (set(t), render(true));
  }

    var from = { z:st.z, tx:st.tx, ty:st.ty }, t0 = performance.now(), dur = 480;
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    (function frame(now){

      if (k < 1) anim = requestAnimationFrame(frame); else { anim = null; render(); }

          var b2 = POS[id]; if (!b2) return;
          leads += '<path d="M' + a.x.toFixed(1) + " " + a.y.toFixed(1) + "L" + b2.x.toFixed(1) + " " + b2.y.toFixed(1) +
            '" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="6 8" fill="none" opacity=".45"/>' +
            '<circle cx="' + b2.x.toFixed(1) + '" cy="' + b2.y.toFixed(1) + '" r="7" fill="var(--ink-3)" opacity=".55"/>';
        });
      });
    }
    if (!st.variant){ g.innerHTML = leads; return; }
    var v = VAR[st.variant];
    var pts = v.route.map(function(id){ return POS[id]; }).filter(Boolean);
    var d = pts.map(function(p, i){ return (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" ");
    g.innerHTML = leads + '<path d="' + d + '" fill="none" stroke="' + v.color + '" stroke-width="7" ' +
      'stroke-linejoin="round" stroke-linecap="round" opacity=".28"/>' +
      '<path d="' + d + '" fill="none" stroke="' + v.color + '" stroke-width="3" ' +
      'stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1 14" opacity=".9"/>';
  }

  function renderStrip(){
    var el = document.getElementById("strip");
    if (!st.variant){ el.hidden = true; return; }
    var v = VAR[st.variant];
    el.hidden = false;
    el.innerHTML =
      '<div class="lead"><span class="k" style="color:' + v.color + '">VARIANTE ' + st.variant + "</span>" +
        '<span class="n">' + v.name + '</span><span class="c">' + v.cost + "</span></div>" +
      '<div class="stops">' + v.stops.map(function(s){
        return '<button class="stop" data-goto="' + s[2] + '"><span class="t" style="color:' + v.color + '">' +
          s[0] + '</span><span class="l">' + s[1] + "</span></button>";
      }).join("") + "</div>";
  }

  function renderHUD(){
    var over = st.level === "over";
    document.getElementById("lvl").textContent = over ? "Übersicht" : "Detail";
    document.getElementById("hint").textContent = over
      ? "Ziehen zum Bewegen · Scrollen zum Zoomen · Gebiet anklicken"
      : "Angebot anklicken für alle Details · Esc schließt";
    ["All","A","B","C"].forEach(function(k){
      var id = "v" + k;
      document.getElementById(id).setAttribute("aria-pressed",
        (k === "All" ? st.variant === null : st.variant === k) ? "true" : "false");
    });
  }

  /* Rebuilding the node layer on every frame would destroy the element a
     click started on, so only rebuild when what is drawn actually changes. */
  var sig = null;
  function render(force){
    var lvl = st.z >= THRESH ? "detail" : "over";
    if (lvl !== st.level){ st.level = lvl; if (lvl === "over") st.open = null; }
    var next = st.level + "|" + st.variant + "|" + st.open;
    if (!force && next === sig) return;
    sig = next;
    world.classList.toggle("over", st.level === "over");
    nodeHost.innerHTML = nodeHTML();
    renderRoutes();
    renderStrip();
    renderHUD();
  }

  /* ============================================================== events */

  nodeHost.addEventListener("click", function(e){
    var cl = e.target.closest("[data-cluster]");
    if (cl){ centerOn(cl.dataset.cluster, 1.6); return; }
    if (e.target.closest("[data-close]")){ st.open = null; render(); return; }
    var sp = e.target.closest("[data-spot]");
    if (sp){
      st.open = sp.dataset.spot;
      render();
      centerOn(st.open, Math.max(st.z, 1.0));
    }
  });

  document.getElementById("strip").addEventListener("click", function(e){
    var b = e.target.closest("[data-goto]");
    if (!b) return;
    var id = b.dataset.goto;
    if (SPOTS.some(function(s){ return s.id === id; })){
      st.open = id;
      if (st.z < THRESH) { st.level = "detail"; }
      render();
      centerOn(id, Math.max(st.z, 1.0));
    } else centerOn(id, Math.max(st.z, 0.7));
  });

  function setVariant(k){
    st.variant = k;
    if (k && st.open){
      var s = SPOTS.filter(function(x){ return x.id === st.open; })[0];
      if (s && s.v.indexOf(k) < 0) st.open = null;
    }
    render();
  }
  document.getElementById("vAll").addEventListener("click", function(){ setVariant(null); });
  ["A","B","C"].forEach(function(k){
    document.getElementById("v" + k).addEventListener("click", function(){ setVariant(st.variant === k ? null : k); });
  });

  document.getElementById("fitBtn").addEventListener("click", function(){ st.open = null; fit(true); });
  document.getElementById("zIn").addEventListener("click", function(){ zoomBy(1.45); });
  document.getElementById("zOut").addEventListener("click", function(){ zoomBy(1 / 1.45); });

  function zoomBy(f, cx, cy){
    var nz = Math.max(ZMIN, Math.min(ZMAX, st.z * f));
    var mx = cx == null ? vw() / 2 : cx, my = cy == null ? vh() / 2 : cy;
    tween({ z:nz, tx:mx - (mx - st.tx) * (nz / st.z), ty:my - (my - st.ty) * (nz / st.z) });
  }

  vp.addEventListener("wheel", function(e){
    e.preventDefault();
    var r = vp.getBoundingClientRect();
    var mx = e.clientX - r.left, my = e.clientY - r.top;
    var nz = Math.max(ZMIN, Math.min(ZMAX, st.z * Math.exp(-e.deltaY * 0.0016)));
    if (anim){ cancelAnimationFrame(anim); anim = null; }
    set({ z:nz, tx:mx - (mx - st.tx) * (nz / st.z), ty:my - (my - st.ty) * (nz / st.z) });
    render();
  }, { passive:false });

  /* drag + pinch */
  /* Capture is claimed only once a drag really starts — capturing on
     pointerdown would retarget the following click away from the node. */
  var pts = new Map(), last = null, pinch = null, dragging = false, captured = null;
  vp.addEventListener("pointerdown", function(e){
    if (e.target.closest(".card")) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pts.size === 1){ last = { x:e.clientX, y:e.clientY }; dragging = false; }
    if (pts.size === 2){
      var a = Array.from(pts.values());
      pinch = { d:Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), z:st.z };
    }
  });
  vp.addEventListener("pointermove", function(e){
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (pts.size === 2 && pinch){
      var a = Array.from(pts.values());
      var d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      var r = vp.getBoundingClientRect();
      var mx = (a[0].x + a[1].x) / 2 - r.left, my = (a[0].y + a[1].y) / 2 - r.top;
      var nz = Math.max(ZMIN, Math.min(ZMAX, pinch.z * (d / pinch.d)));
      set({ z:nz, tx:mx - (mx - st.tx) * (nz / st.z), ty:my - (my - st.ty) * (nz / st.z) });
      return;
    }
    if (!last) return;
    var dx = e.clientX - last.x, dy = e.clientY - last.y;
    if (!dragging){
      if (Math.abs(dx) + Math.abs(dy) < 5) return;
      dragging = true;
      captured = e.pointerId;
      vp.setPointerCapture(e.pointerId);
      vp.classList.add("drag");
    }
    last = { x:e.clientX, y:e.clientY };
    if (anim){ cancelAnimationFrame(anim); anim = null; }
    set({ z:st.z, tx:st.tx + dx, ty:st.ty + dy });
  });
  function up(e){
    pts.delete(e.pointerId);
    if (pts.size < 2) pinch = null;
    if (captured === e.pointerId){
      if (vp.hasPointerCapture(e.pointerId)) vp.releasePointerCapture(e.pointerId);
      captured = null;
    }
    if (pts.size === 0){ last = null; dragging = false; vp.classList.remove("drag"); render(); }
  }
  vp.addEventListener("pointerup", up);
  vp.addEventListener("pointercancel", up);

  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){ if (st.open){ st.open = null; render(); } else if (st.variant) setVariant(null); }
    else if (e.key === "+" || e.key === "=") zoomBy(1.45);
    else if (e.key === "-") zoomBy(1 / 1.45);
    else if (e.key === "0"){ st.open = null; fit(true); }
    else if (e.key === "a" || e.key === "A") setVariant(st.variant === "A" ? null : "A");
    else if (e.key === "b" || e.key === "B") setVariant(st.variant === "B" ? null : "B");
    else if (e.key === "c" || e.key === "C") setVariant(st.variant === "C" ? null : "C");
  });

  window.addEventListener("resize", function(){ render(true); });

  /* ============================================================== boot */

  buildGeo();
  world.style.width = W + "px";
  world.style.height = H + "px";
  fit(false);
})();
</script>
</body>
</html>
