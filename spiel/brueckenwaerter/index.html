<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brückenwärter</title>
<link rel="canonical" href="../../brueckenwaerter/">
<meta http-equiv="refresh" content="0; url=../../brueckenwaerter/">
<meta name="theme-color" content="#10212f">
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10212f;color:#eef3f7;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  a{color:#f2b544}
</style>
</head>
<body>
  <!-- Brückenwärter ist nach ../../brueckenwaerter/ umgezogen. sw.js daneben räumt den alten
       Offline-Speicher auf und schickt Seiten, die noch vom alten Service Worker kommen, dorthin. -->
  <p>Brückenwärter ist umgezogen. Weiter zu <a href="../../brueckenwaerter/">…/brueckenwaerter/</a> …</p>
  <script>
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      // Den Umzugs-Worker anmelden, damit er den alten ersetzt und dessen Speicher leert.
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
    location.replace("../../brueckenwaerter/" + location.search + location.hash);
  </script>
</body>
</html>
